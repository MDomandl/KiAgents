extends = "strategy.toml"

top_k = 12
buffer_k = 3
use_sector_limits = true
max_per_sector = 3
adjusted = true

score_days = 200
vol_days   = 63

as_of  = "2025-10-08"

# --- Decision Bundles ---
dump_decision_bundles = true
dump_selection = false
decisions_dir = "aktien_oop/decisions"
decision_prefix = "BT"

# --- Daten & Pfade ---
tickers_file   = "aktien_oop/sp500_tickers.txt"
sector_meta    = "aktien_oop/sp500_meta.csv"   # optional; leer lassen, wenn nicht vorhanden
save_dir       = "aktien_oop"

# --- Zeitraum & Frequenz ---
start          = "2020-10-13"
end            = "2025-10-09"


dump_scores = true
dump_tag = "BT"

# --- Portfolio-Logik ---
[topk]
top_k          = 12           # Anzahl Aktien im Portfolio
buffer_k       = 3           # Turnover-Puffer

[rebalance]
frequency      = "monthly"   # "monthly" oder "weekly"

[limits]
use_sector_limits = true
max_per_sector = 3           # 0 oder negativ = deaktiviert
max_active_names    = 9     # 8 .... oder 15, wenn du etwas „Luft“ willst

# --- Kostenmodell (Basispunkte) ---
cost_bps       = 0
slippage_bps   = 7.0

# --- Mindesthistorie in Tagen (für Signale) ---
min_history_days = 260

# --- Logging ---
verbose        = false

# --- Gewichtung & Reibung ---
use_equal_weight  = false   # statt inverse-Vol
friction_eps      = 0.0    # 0.0015  .... 1 Prozentpunkt Gewichtsdiff als Schwelle
friction_eps_pct = 0.00
weight_round_step  = 0.01        # 0.01 ... Zielgewichte auf 2 %-Punkt runden
max_turnover_cap = 1.0   # 0.40 ... pro Termin max. 50 % umschichten (weiches Cap)
min_position_weight = 0.01   # 0.01 .... 1 %-Punkt

# --- Regime & VolTarget ---
regime_use_filter   = false  # true .....
regime_sma_days     = 200
regime_exposure_low = 0.65     # nur 60% Exposure, wenn Benchmark < SMA200

# Volatility Targeting (optional)
vol_target_ann      = 0.00   #  0.20 ......
vol_lookback_days   = 20

# --- Benchmarks ---
dual_benchmark = false
benchmark_ticker  = "SPY"   # z.B. "SXR8.DE" für thesaurierenden S&P500 in EUR
benchmark2  = "SXR8.DE"   # z.B. "SXR8.DE" für thesaurierenden S&P500 in EUR

# --- Rebalance ---
rebalance_every_n  = 1         # nur jeden 2. Termin wirklich traden

# --- Cash ---
# SELL + include_cash=true  -> risk-off (100% CASH)
# SELL + include_cash=false -> flat portfolio (no exposure, no yield)
include_cash      = true      # true ..... explizites CASH-Gewicht als Residuum führen
cash_yield_annual = 0.00      # 0.02 = 2% p.a.; 0.00 = zinsloses Cash
max_weight_per_name = 1.0   # 0.30 .... 25% pro Name

[core]
period = "800d"
as_of  = "2025-10-10"

[windows]
score_days = 200
vol_days   = 63

[regime]
# Regime-Filter: S&P500 muss über SMA liegen, sonst greift die Policy unten
require_above_sma = true
# Anzahl Tage für die SMA des Regime-Indikators (z. B. S&P 500)
regime_sma_days = 200
# SELL + include_cash=true  -> risk-off (100% CASH)
# SELL + include_cash=false -> flat portfolio (no exposure, no yield)
# Aktion, wenn das Regime NICHT erfüllt ist (ok == false):
# - HOLD : Portfolio unverändert weiterführen (keine Umschichtung)
# - SELL : Alle Positionen schließen (Cash / Flat)
regime_below_action = "SELL"  # "SELL" | "HOLD"

