extends = "strategy.toml"


top_k = 12
buffer_k = 3
use_sector_limits = true
max_per_sector = 3
adjusted = true

# Logging & Bundles
dump_decision_bundles = true
decisions_dir = "aktien_oop/decisions"
decision_prefix = "RUN"
save_dir = "aktien_oop"
tickers_file = "aktien_oop/sp500_tickers.txt"
sector_meta = "aktien_oop/sp500_meta.csv"

dump_scores = true
dump_tag = "RUN"

[core]
period = "801d"
as_of = "2025-04-30"

[windows]
score_days = 200
vol_days   = 63

[topk]
top_k = 12
buffer_k = 3

[rebalance]
frequency  = "monthly"

[limits]
use_sector_limits = true
max_per_sector = 3
gap_filter = 0.0   # 0.12 ..... normal

# Filter so wie im BT/Helper gedacht
days_win = 130
gap_th = 0.15
adv_min_dollars = 5000000

# Filter erstmal entschärfen
min_price  = 0.0
min_volume = 0.0

# Gewichtung & Reibung exakt wie im BT (falls du magst)
friction_eps       = 0.0015
friction_eps_pct   = 0.00
weight_round_step  = 0.01
max_turnover_cap   = 0.40

# Cash & Kosten kannst du optional anpassen;
# fürs Matching sind sie nachrangig, aber schaden nicht:
cost_bps         = 0
slippage_bps     = 7.0

max_lookback_days = 720

verbose = true
force_rebalance = true
use_equal_weight = false

[filters]
gap_max_days = 0        # oder: gap_pct_max = 0.0 (je nach Implementierung)
sma_window   = 200

[regime]
include_cash     = true
# Regime-Filter: S&P500 muss über SMA liegen, sonst greift die Policy unten
require_above_sma = true
# Anzahl Tage für die SMA des Regime-Indikators (z. B. S&P 500)
regime_sma_days = 200
# Aktion, wenn das Regime NICHT erfüllt ist (ok == false):
# - HOLD : Portfolio unverändert weiterführen (keine Umschichtung)
# - SELL : Alle Positionen schließen (Cash / Flat)
regime_below_action = "SELL"  # "SELL" | "HOLD"

